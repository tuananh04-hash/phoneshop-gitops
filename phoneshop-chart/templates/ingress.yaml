apiVersion: networking.k8s.io/v1
kind: Ingress
# Định nghĩa một Kubernetes Ingress để quản lý truy cập bên ngoài vào các dịch vụ trong cluster.
# Ingress cung cấp định tuyến HTTP/HTTPS từ bên ngoài đến các dịch vụ bên trong.
metadata:
  name: phoneshop-ingress
  # Khối này sẽ render các annotations được định nghĩa trong values.yaml
  # Rất quan trọng cho việc tích hợp với cert-manager
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Lấy ingressClassName từ values.yaml
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  # Lấy cấu hình TLS từ values.yaml
  {{- if .Values.ingress.tls }}
  tls:
  {{- range .Values.ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . | quote }}
      {{- end }}
      secretName: {{ .secretName }}
  {{- end }}
  {{- end }}
  rules:
  # Vòng lặp để tạo các rule cho mỗi host trong values.yaml
  {{- range .Values.ingress.hosts }}
  - host: {{ .host | quote }}
    http:
      paths:
      # Vòng lặp để tạo các path rule cho mỗi host
      {{- range .paths }}
      - path: {{ .path }}
        pathType: {{ .pathType }}
        backend:
          service:
            name: {{ .serviceName }}
            port:
              number: {{ .servicePort }}
      {{- end }}
  {{- end }}