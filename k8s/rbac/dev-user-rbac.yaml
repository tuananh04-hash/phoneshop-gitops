# 1. Tạo đối tượng tài khoản (Service Account)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-user
  namespace: default
---
# 2. Định nghĩa quyền hạn (Role): Chỉ được xem (get, list) và đọc log (watch) của Pod
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader-role
  namespace: default
rules:
- apiGroups: [""] # "" là nhóm Core API mặc định chứa các tài nguyên cơ bản
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
# 3. Gắn quyền cho tài khoản (Role Binding)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-user-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: dev-user
  namespace: default
roleRef:
  kind: Role
  name: pod-reader-role
  apiGroup: rbac.authorization.k8s.io
